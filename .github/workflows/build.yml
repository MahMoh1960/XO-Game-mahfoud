name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Préparer les fichiers web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Créer le projet Android (Capacitor)
        run: |
          echo '{"name":"xo-game","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "XO Morpion" com.mahfoud.xogame --web-dir www
          npx cap add android
          npx cap sync android

      - name: Mettre l'icône de l'appli
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp icon-512.png "$d/ic_launcher.png"
            cp icon-512.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: XO-Morpion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
